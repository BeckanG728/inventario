spring:
  application:
    name: inventario-taller
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  mvc:
    apiversion:
      supported: ${API_VERSIONS_SUPPORTED}
      use:
        header: ${API_VERSION_HEADER}

server:
  port: ${SERVER_PORT}


jwt:
  expiration: ${JWT_EXPIRACION_SEGUNDOS}
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info

admin:
  username: ${ADMIN_USERNAME}
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}